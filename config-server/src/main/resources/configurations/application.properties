eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:4090/eureka}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# Use RestTemplate instead of RestClient for Eureka communication.
# Spring Cloud 2025 auto-applies LoadBalancerInterceptor to all RestClient
# instances, which contaminates Eureka's internal HTTP client and causes a
# circular BeanCurrentlyInCreationException at startup.
eureka.client.restclient.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
